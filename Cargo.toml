[package]
name = "uninstall"
version = "0.20.0"
edition = "2024"
rust-version = "1.85"
description = "Find, explain, and safely remove Linux software"
license = "MIT"
repository = "https://github.com/JaredTweed/uninstall"

[[bin]]
name = "uninstall"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
flate2 = "1.1"
hex = "0.4"
libc = "0.2"
rayon = "1.11"
regex = "1.11"
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.20"
unicode-normalization = "0.1"
wait-timeout = "0.2"
walkdir = "2.5"
rustix = { version = "1.1", features = ["fs", "process"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
