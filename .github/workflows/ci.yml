name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.85", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - run: test "$(target/release/uninstall --version)" = "uninstall 0.20.0"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh tests/integration_remove.sh
      - run: sh -n install.sh
      - run: git diff --check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl
      - run: target/x86_64-unknown-linux-musl/release/uninstall --version
      - uses: actions/upload-artifact@v4
        with:
          name: uninstall-x86_64-musl
          path: target/x86_64-unknown-linux-musl/release/uninstall

  distro-smoke:
    needs: build-static
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:stable-slim
          - ubuntu:latest
          - fedora:latest
          - alpine:latest
          - archlinux:latest
          - opensuse/tumbleweed:latest
          - voidlinux/voidlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: uninstall-x86_64-musl
          path: dist
      - run: chmod 755 dist/uninstall
      - name: Perform a real disposable removal
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "$IMAGE" sh -c '
            if command -v xbps-install >/dev/null 2>&1; then
              repository_file=/usr/share/xbps.d/00-repository-main.conf
              if [ -f "$repository_file" ]; then
                sed -i "s|alpha.de.repo.voidlinux.org|repo-default.voidlinux.org|" "$repository_file"
              fi
              xbps-install -Suy xbps
            fi
            UNINSTALL_BIN=/work/dist/uninstall sh tests/integration_remove.sh
          '
