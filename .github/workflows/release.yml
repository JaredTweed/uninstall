name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            architecture: x86_64
          - target: aarch64-unknown-linux-musl
            architecture: aarch64
          - target: armv7-unknown-linux-musleabihf
            architecture: armv7
          - target: i686-unknown-linux-musl
            architecture: i686
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Verify tag version
        run: |
          manifest_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$manifest_version" = "${GITHUB_REF_NAME#v}"
      - run: cross build --locked --release --target ${{ matrix.target }}
      - name: Prepare asset
        run: |
          asset=uninstall-linux-${{ matrix.architecture }}-musl
          cp target/${{ matrix.target }}/release/uninstall "$asset"
          chmod 755 "$asset"
          sha256sum "$asset" > "$asset.sha256"
          if [ "${{ matrix.architecture }}" = x86_64 ]; then
            test "$(./$asset --version)" = "uninstall ${GITHUB_REF_NAME#v}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.architecture }}
          path: uninstall-linux-${{ matrix.architecture }}-musl*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign release files
        run: |
          for file in uninstall-linux-*-musl; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            uninstall-linux-*-musl uninstall-linux-*-musl.sha256 uninstall-linux-*-musl.sigstore.json
      - name: Verify published installer end to end
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix=$(mktemp -d)
          curl -fsSL "https://raw.githubusercontent.com/JaredTweed/uninstall/${GITHUB_REF_NAME}/install.sh" | PREFIX="$prefix" sh
          test "$("$prefix/bin/uninstall" --version)" = "uninstall ${GITHUB_REF_NAME#v}"
          printf 'y\n' | "$prefix/bin/uninstall" --self-uninstall
          test ! -e "$prefix/bin/uninstall"
