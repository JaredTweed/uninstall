name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify tag and tests
        run: |
          test "$(./uninstall --version)" = "uninstall ${GITHUB_REF_NAME#v}"
          python -m unittest discover -s tests
      - name: Build glibc executable
        run: |
          python -m pip install pyinstaller
          pyinstaller --clean --onefile --name uninstall-linux-${{ matrix.architecture }}-glibc uninstall
          mv dist/uninstall-linux-${{ matrix.architecture }}-glibc .
      - name: Build musl executable
        run: |
          docker run --rm -v "$PWD:/src" -w /src python:3.13-alpine sh -c '
            apk add --no-cache binutils gcc musl-dev zlib-dev &&
            pip install pyinstaller &&
            pyinstaller --clean --onefile --distpath /src/dist-musl --name uninstall-linux-${{ matrix.architecture }}-musl uninstall
          '
          mv dist-musl/uninstall-linux-${{ matrix.architecture }}-musl .
      - name: Checksums
        run: |
          sha256sum uninstall-linux-${{ matrix.architecture }}-* > checksums-${{ matrix.architecture }}.txt
          for file in uninstall-linux-${{ matrix.architecture }}-*; do sha256sum "$file" > "$file.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.architecture }}
          path: |
            uninstall-linux-${{ matrix.architecture }}-*
            checksums-${{ matrix.architecture }}.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign release files
        run: |
          for file in uninstall-linux-*-glibc uninstall-linux-*-musl; do
            cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
          done
      - name: Publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            uninstall-linux-* checksums-*.txt
